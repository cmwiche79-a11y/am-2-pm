<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Am2Pm — Daily Focus, Matter Stages & Wins Folder</title>
  <style>
    :root {
      --bg: #f4f7fc;
      --white: #ffffff;
      --royal: #1d4ed8;
      --royal-dark: #1e3a8a;
      --royal-soft: #eff6ff;
      --royal-border: #dbeafe;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --green: #10b981;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: var(--bg);
      min-height: 100vh;
      padding: 18px 16px 96px;
      position: relative;
    }

    /* Inception Setup Modal */
    .onboarding-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 100;
    }
    .onboarding-overlay.open { display: flex; }
    .onboarding-card {
      width: 100%;
      max-width: 440px;
      background: var(--white);
      border-radius: 22px;
      padding: 24px 20px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.25);
    }
    .onboarding-badge {
      display: inline-block;
      background: var(--royal-soft);
      color: var(--royal);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 10px;
    }
    .onboarding-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }
    .onboarding-sub {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 18px;
    }
    .time-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .time-field label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .time-field input[type="time"] {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      background: var(--bg);
      outline: none;
    }
    .time-field input[type="time"]:focus {
      border-color: var(--royal);
      background: var(--white);
    }
    .schedule-note {
      background: var(--royal-soft);
      border: 1px solid var(--royal-border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.76rem;
      color: var(--royal-dark);
      line-height: 1.45;
      margin-bottom: 16px;
    }

    /* Top Header */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .brand-sub {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 500;
    }
    .brand-title {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      margin-top: 2px;
    }
    .brand-title span { color: var(--royal); }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--white);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--royal);
      box-shadow: var(--shadow);
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }

    /* Hero Royal Blue Card */
    .hero-card {
      background: linear-gradient(135deg, var(--royal) 0%, var(--royal-dark) 100%);
      color: var(--white);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 12px 24px rgba(29, 78, 216, 0.24);
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
    }
    .hero-card::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
      top: -45px;
      right: -35px;
      pointer-events: none;
    }
    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      opacity: 0.92;
      margin-bottom: 8px;
    }
    .power-toggle {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: var(--white);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }
    .hero-score {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 2px 0;
    }
    .hero-sub {
      font-size: 0.8rem;
      opacity: 0.88;
      margin-bottom: 14px;
    }
    .hero-bar-bg {
      background: rgba(255, 255, 255, 0.22);
      height: 7px;
      border-radius: 999px;
      overflow: hidden;
    }
    .hero-bar-fill {
      background: var(--white);
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* 4 Quick Action Tiles */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .quick-btn {
      background: transparent;
      border: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text);
    }
    .quick-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: var(--white);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: var(--text);
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .quick-btn.primary .quick-icon {
      background: var(--royal-soft);
      border-color: var(--royal-border);
      color: var(--royal);
      font-size: 1.35rem;
    }
    .quick-btn.active-filter .quick-icon {
      background: var(--royal);
      color: var(--white);
      border-color: var(--royal);
    }
    .quick-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
    }
    .quick-btn.active-filter .quick-label { color: var(--royal); }

    /* Section Headers */
    .sec-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 6px 0 12px;
      gap: 8px;
    }
    .sec-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }
    .sec-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sec-action {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--royal);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
    }
    .sec-action.secondary {
      color: var(--muted);
    }

    /* Task & Matter Cards */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .task-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px 14px;
      box-shadow: var(--shadow);
      transition: opacity 0.2s ease;
    }
    .task-card.done { opacity: 0.62; }
    .task-top-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cat-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }
    .bg-litigation { background: #ffe4e6; color: #be123c; }
    .bg-conveyancing { background: #f3e8ff; color: #7e22ce; }
    .bg-probate { background: #e0f2fe; color: #0369a1; }
    .bg-corporate { background: #dcfce7; color: #15803d; }

    .task-body { flex: 1; min-width: 0; cursor: pointer; }
    .task-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      word-wrap: break-word;
    }
    .task-card.done .task-title {
      text-decoration: line-through;
      color: var(--muted);
    }
    .task-meta {
      font-size: 0.73rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .prio-tag {
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 1px 6px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.68rem;
    }
    .carry-tag {
      color: var(--royal);
      background: var(--royal-soft);
      border: 1px solid var(--royal-border);
      padding: 1px 6px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.68rem;
    }
    .task-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .check-circle {
      min-width: 32px;
      height: 28px;
      padding: 0 8px;
      border-radius: 999px;
      border: 1.5px solid var(--royal-border);
      background: var(--royal-soft);
      color: var(--royal);
      font-weight: 800;
      font-size: 0.68rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .task-card.done .check-circle {
      background: var(--royal);
      border-color: var(--royal);
      color: var(--white);
    }
    .win-pill-btn {
      height: 28px;
      padding: 0 8px;
      border-radius: 999px;
      border: 1px solid var(--royal-border);
      background: var(--white);
      color: var(--royal-dark);
      font-weight: 700;
      font-size: 0.68rem;
      cursor: pointer;
    }
    .win-pill-btn:hover {
      background: var(--royal-soft);
    }
    .del-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 5px;
    }
    .del-btn:hover { color: #dc2626; }

    /* Stage Progress Banner inside Card */
    .stage-strip {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--bg);
    }
    .stage-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .stage-current-label {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--royal-dark);
      cursor: pointer;
    }
    .stage-current-label span {
      color: var(--muted);
      font-weight: 600;
    }
    .advance-btn {
      background: var(--royal-soft);
      border: 1px solid var(--royal-border);
      color: var(--royal);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }
    .advance-btn:hover {
      background: var(--royal);
      color: var(--white);
    }
    .mini-bar-bg {
      height: 5px;
      background: var(--royal-soft);
      border-radius: 999px;
      overflow: hidden;
    }
    .mini-bar-fill {
      height: 100%;
      background: var(--royal);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    /* Expandable Requirements Checklist */
    .stage-drawer {
      margin-top: 10px;
      background: var(--bg);
      border-radius: 12px;
      padding: 10px 12px;
      display: none;
    }
    .stage-drawer.open { display: block; }
    .req-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 0.78rem;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .req-item:last-of-type { border-bottom: none; }
    .req-item.req-done {
      text-decoration: line-through;
      color: var(--muted);
    }
    .req-box {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1.5px solid var(--royal);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--white);
      background: var(--white);
      flex-shrink: 0;
    }
    .req-item.req-done .req-box {
      background: var(--royal);
    }
    .add-req-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .add-req-row input {
      flex: 1;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.76rem;
      outline: none;
    }
    .add-req-row button {
      padding: 7px 10px;
      border-radius: 8px;
      border: none;
      background: var(--royal);
      color: var(--white);
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Segmented Control */
    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--white);
      border: 1px solid var(--border);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .segmented.three { grid-template-columns: repeat(3, 1fr); }
    .segmented.five { grid-template-columns: repeat(5, 1fr); }
    .seg-btn {
      border: none;
      background: transparent;
      padding: 9px 4px;
      border-radius: 10px;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .seg-btn.active {
      background: var(--royal);
      color: var(--white);
    }

    /* Analytics Bar Chart & Milestone Cards */
    .white-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .big-stat-label { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
    .big-stat-num { font-size: 1.9rem; font-weight: 800; color: var(--text); margin: 4px 0; }
    .big-stat-sub { font-size: 0.78rem; color: var(--royal); font-weight: 600; }

    .bar-chart {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      align-items: end;
      height: 130px;
      margin-top: 18px;
      padding-top: 10px;
    }
    .bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      gap: 6px;
    }
    .bar-pill {
      width: 100%;
      max-width: 24px;
      background: var(--royal-soft);
      border-radius: 8px;
      min-height: 8px;
      transition: height 0.3s ease;
    }
    .bar-pill.today { background: var(--royal); }
    .bar-day { font-size: 0.7rem; color: var(--muted); font-weight: 600; }

    .breakdown-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--bg);
    }
    .breakdown-row:last-child { border-bottom: none; }
    .breakdown-left { display: flex; align-items: center; gap: 10px; }
    .breakdown-name { font-size: 0.88rem; font-weight: 600; }
    .breakdown-sub { font-size: 0.73rem; color: var(--muted); }
    .breakdown-right { text-align: right; }
    .breakdown-pct { font-size: 0.88rem; font-weight: 700; color: var(--royal); }

    .goal-progress-bg {
      background: var(--royal-soft);
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }
    .goal-progress-fill {
      background: var(--royal);
      height: 100%;
      border-radius: 999px;
    }

    /* Wins Folder Cards */
    .win-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .win-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .win-title {
      font-size: 0.98rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 3px;
    }
    .win-date {
      font-size: 0.74rem;
      color: var(--muted);
      font-weight: 600;
    }
    .win-field {
      margin-top: 8px;
      font-size: 0.8rem;
      line-height: 1.45;
      color: var(--text);
    }
    .win-field-label {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--royal);
      display: block;
      margin-bottom: 2px;
    }
    .win-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--bg);
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      background: var(--white);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 10px 4px 14px;
      z-index: 40;
    }
    .nav-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 2px;
    }
    .nav-btn.active { color: var(--royal); }

    /* Slide-Up Bottom Sheets */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 60;
    }
    .sheet-backdrop.open { display: flex; }
    .sheet {
      width: 100%;
      max-width: 520px;
      background: var(--white);
      border-radius: 24px 24px 0 0;
      padding: 20px 18px 28px;
      box-shadow: 0 -10px 30px rgba(15, 23, 42, 0.15);
      max-height: 90vh;
      overflow-y: auto;
    }
    .sheet-handle {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 999px;
      margin: 0 auto 14px;
    }
    .sheet-title {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .sheet input[type="text"],
    .sheet input[type="date"],
    .sheet textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      font-size: 0.9rem;
      margin-bottom: 10px;
      outline: none;
      font-family: inherit;
    }
    .sheet textarea {
